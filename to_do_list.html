<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>

    <link rel="stylesheet" href="style6.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header>
            <div>
                <h1>My To-Do List</h1>
                <p>Organize your day and get things done ✨</p>
            </div>

            <button id="themeBtn" class="theme-btn">🌙</button>
        </header>


        <!-- Statistics -->
        <section class="stats">

            <div class="stat-card">
                <span>📋</span>
                <div>
                    <h3 id="totalTasks">0</h3>
                    <p>Total Tasks</p>
                </div>
            </div>

            <div class="stat-card">
                <span>⏳</span>
                <div>
                    <h3 id="activeTasks">0</h3>
                    <p>Active</p>
                </div>
            </div>

            <div class="stat-card">
                <span>✅</span>
                <div>
                    <h3 id="completedTasks">0</h3>
                    <p>Completed</p>
                </div>
            </div>

        </section>


        <!-- Progress -->
        <section class="progress-section">

            <div class="progress-info">
                <span>Today's Progress</span>
                <span id="progressText">0%</span>
            </div>

            <div class="progress-bar">
                <div id="progress"></div>
            </div>

        </section>


        <!-- Add Task -->
        <section class="task-form">

            <input
                type="text"
                id="taskInput"
                placeholder="What do you need to do?"
            >

            <select id="category">
                <option value="Personal">Personal</option>
                <option value="Work">Work</option>
                <option value="Study">Study</option>
                <option value="Other">Other</option>
            </select>

            <select id="priority">
                <option value="Low">Low Priority</option>
                <option value="Medium">Medium Priority</option>
                <option value="High">High Priority</option>
            </select>

            <input type="date" id="dueDate">

            <button id="addBtn">+ Add Task</button>

        </section>


        <!-- Search and Filters -->
        <section class="controls">

            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search tasks..."
            >

            <div class="filters">
                <button class="filter active" data-filter="all">
                    All
                </button>

                <button class="filter" data-filter="active">
                    Active
                </button>

                <button class="filter" data-filter="completed">
                    Completed
                </button>
            </div>

        </section>


        <!-- Tasks -->
        <main id="taskList">

            <!-- Tasks will appear here -->

            <div class="empty-message" id="emptyMessage">
                <div>📝</div>
                <h2>No tasks yet</h2>
                <p>Add your first task and start being productive!</p>
            </div>

        </main>


        <!-- Bottom -->
        <div class="bottom-section">

            <span id="taskCount">0 tasks remaining</span>

            <button id="clearCompleted">
                Clear Completed
            </button>

        </div>

    </div>


    <script src="logic2.js"></script>

</body>
</html>
